[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skqd_z2lgt"
version = "0.9.0"
description = "QCHPC demonstration with 2D Z2 LGT."
authors = [
    { name = "Yutaro Iiyama", email = "iiyama@icepp.s.u-tokyo.ac.jp" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "qiskit",
    "qiskit-ibm-runtime",
    "rustworkx",
    "pydantic",
    "pymatching",
    "jax[cuda12]",
    "optax",
    "flax",
    "prefect",
    "qcsc-prefect[qiskit]",
    "mpi4py",
    "rqutils",
    "heavyhex-qft"
]

[project.scripts]
skqd-z2lgt-deploy = "skqd_z2lgt.main:deploy"
